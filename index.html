<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLACK MATRIX - Control Center</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-green-500 font-mono min-h-screen p-4 md:p-6">
  <div class="max-w-4xl mx-auto border border-green-500/30 p-4 md:p-6 rounded-xl shadow-[0_0_20px_rgba(34,197,94,0.1)]">
    <h1 class="text-2xl md:text-3xl font-bold tracking-widest border-b border-green-500/30 pb-4 mb-6 text-center">BLACK MATRIX</h1>

    <!-- حالة النظام -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
      <div class="border border-green-500/20 p-4 rounded bg-black/50 text-center">
        <p class="text-xs text-gray-400">حالة النظام</p>
        <p class="text-lg font-bold text-green-400">شغال (Online)</p>
      </div>
      <div class="border border-green-500/20 p-4 rounded bg-black/50 text-center">
        <p class="text-xs text-gray-400">الذاكرة التفاعلية</p>
        <p class="text-lg font-bold text-green-400">مُفعلة (Active)</p>
      </div>
      <div class="border border-green-500/20 p-4 rounded bg-black/50 text-center">
        <p class="text-xs text-gray-400">محرك الذكاء الاصطناعي</p>
        <p class="text-lg font-bold text-green-400">Llama 3.3 70B</p>
      </div>
    </div>

    <!-- صندوق المحادثة -->
    <div id="chat-box" class="border border-green-500/20 p-4 rounded bg-black/50 h-80 overflow-y-auto mb-6 space-y-3">
      <div class="text-green-300">[BLACK MATRIX]: جاهز لاستقبال الأوامر والنصوص.</div>
    </div>

    <!-- نموذج الإرسال -->
    <form id="ai-form" class="flex gap-2">
      <input type="text" id="user-input" placeholder="اكتب أمرك أو سؤالك هنا..." class="flex-1 bg-black border border-green-500/30 rounded px-4 py-2 text-white focus:outline-none">
      <button type="submit" id="send-btn" class="bg-green-600 hover:bg-green-500 text-black font-bold px-6 py-2 rounded transition-colors">إرسال</button>
    </form>
  </div>

  <script>
    const WORKER_URL = "https://broad-river-d415.dilrbre.workers.dev";
    const form = document.getElementById('ai-form');
    const input = document.getElementById('user-input');
    const chatBox = document.getElementById('chat-box');
    const sendBtn = document.getElementById('send-btn');
    let conversationHistory = [];

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const prompt = input.value.trim();
      if (!prompt) return;

      chatBox.innerHTML += `<div class="text-gray-400"><strong>[أنت]:</strong> ${prompt}</div>`;
      input.value = '';
      sendBtn.disabled = true;
      sendBtn.innerText = 'جاري التفكير...';
      chatBox.scrollTop = chatBox.scrollHeight;

      conversationHistory.push({ role: "user", content: prompt });

      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: conversationHistory })
        });

        const data = await res.json();
        
        if (data.choices && data.choices[0] && data.choices[0].message) {
          const aiReply = data.choices[0].message.content;
          const replyDiv = document.createElement('div');
          replyDiv.className = 'text-green-400';
          const strong = document.createElement('strong');
          strong.textContent = '[BLACK MATRIX]: ';
          replyDiv.appendChild(strong);
          replyDiv.appendChild(document.createTextNode(aiReply));
          chatBox.appendChild(replyDiv);

          conversationHistory.push({ role: "assistant", content: aiReply });
        } else if (data.error) {
          const errDetail = (data.error && typeof data.error === 'object')
            ? (data.error.message || JSON.stringify(data.error))
            : String(data.error);

          const errDiv = document.createElement('div');
          errDiv.className = 'text-red-400';

          const label = document.createElement('strong');
          label.textContent = '[BLACK MATRIX]: ';
          errDiv.appendChild(label);

          errDiv.appendChild(document.createTextNode(`خطأ: ${errDetail}`));
          chatBox.appendChild(errDiv);
        } else {
          const infoDiv = document.createElement('div');
          infoDiv.className = 'text-red-400';

          const label = document.createElement('strong');
          label.textContent = '[BLACK MATRIX]: ';
          infoDiv.appendChild(label);

          infoDiv.appendChild(document.createTextNode('استجابة غير متوقعة من السيرفر.'));
          chatBox.appendChild(infoDiv);
        }
      } catch (err) {
        const catchDiv = document.createElement('div');
        catchDiv.className = 'text-red-400';

        const label = document.createElement('strong');
        label.textContent = '[BLACK MATRIX]: ';
        catchDiv.appendChild(label);

        const msg = (err && err.message) ? `خطأ في الاتصال بالسيرفر. (${err.message})` : 'خطأ في الاتصال بالسيرفر.';
        catchDiv.appendChild(document.createTextNode(msg));
        chatBox.appendChild(catchDiv);
      }

      sendBtn.disabled = false;
      sendBtn.innerText = 'إرسال';
      chatBox.scrollTop = chatBox.scrollHeight;
    });
  </script>
</body>
</html>
